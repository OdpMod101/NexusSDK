name: Kompilacja NexusSDK APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    <p>Ustawienie Javy pod kompilację Androida
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    <p>Budowanie aplikacji i silnika za pomocą Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Udostępnij gotową aplikację APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus_sdk_launcher
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
