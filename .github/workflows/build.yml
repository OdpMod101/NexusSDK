name: Kompilacja NexusSDK APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Uruchamiamy oficjalne środowisko Java
    - name: Ustawienie Javy 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Dostarczamy brakujące Android Services i SDK (To rozwiąże problem niedostępności usług!)
    - name: Inicjalizacja Android SDK Tools
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # 3. Zamiast globalnego gradle, używamy automatycznego kreatora, który sam pobierze brakujące pliki budowania
    - name: Budowanie aplikacji APK
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1.1'
        arguments: |
          -p android :app:assembleRelease

    # 4. Eksportujemy gotowy, działający plik instalacyjny programu
    - name: Udostępnij gotową aplikację APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus_sdk_launcher
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
