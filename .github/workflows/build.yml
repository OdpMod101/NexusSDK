name: Kompilacja NexusSDK APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Java 17 jest wymagana do poprawnego działania Gradle 8+
    - name: Ustawienie Javy 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Wymuszamy wersję 8.1.1, żeby była w 100% zgodna z naszym nowym build.gradle
    - name: Konfiguracja Gradle 8.1.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    # Budujemy czysty plik APK
    - name: Budowanie projektu przez Gradle
      run: |
        cd android
        gradle :app:assembleRelease

    # GitHub udostępni gotowy plik APK jako artefakt do pobrania
    - name: Udostępnij gotową aplikację APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus_sdk_launcher
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
