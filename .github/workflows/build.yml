name: Kompilacja NexusSDK APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Ustawienie Javy pod kompilację Androida
    - name: Ustawienie Javy
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Wymuszenie stabilnej i sprawdzonej wersji Gradle 8.0
    - name: Konfiguracja stabilnego Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    # Budowanie aplikacji za pomocą wymuszonej wersji Gradle
    - name: Budowanie projektu przez Gradle
      run: |
        cd android
        gradle assembleRelease

    - name: Udostępnij gotową aplikację APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus_sdk_launcher
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
