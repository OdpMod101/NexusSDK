name: Kompilacja NexusSDK APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Uruchamiamy oficjalne środowisko Java
    - name: Ustawienie Javy 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Dostarczamy Android Services i SDK
    - name: Inicjalizacja Android SDK Tools
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # 3. Konfiguracja samego środowiska Gradle (bez usuwanego parametru arguments)
    - name: Konfiguracja Gradle 8.1.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1.1'

    # 4. Właściwe wywołanie kompilacji przez standardową komendę shell
    - name: Budowanie aplikacji APK
      run: |
        cd android
        gradle :app:assembleRelease

    # 5. Eksport gotowego pliku instalacyjnego programu
    - name: Udostępnij gotową aplikację APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus_sdk_launcher
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
