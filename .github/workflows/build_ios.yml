name: Kompilacja NexusSDK iOS dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_ios:
    # Uruchamiamy wirtualnego Maca od Apple dostarczanego przez GitHub
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # Kompilujemy czysty kod C++ naszego silnika bezpośrednio pod system iOS
    - name: Budowanie pliku .dylib przez CMake i Xcode
      run: |
        cd ios
        cmake -B build \
          -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    # Pobieramy czystą bibliotekę dynamiczną Apple jako gotowy artefakt
    - name: Udostępnij plik dylib na iOS
      uses: actions/upload-artifact@v4
      with:
        name: nexus_engine_ios
        path: ios/build/Release-iphoneos/libnexus_core_ios.dylib
        
