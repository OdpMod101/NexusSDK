plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.sdk'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexus.sdk"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Łączymy z naszym plikiem CMakeLists.txt, aby automatycznie kompilować silnik .so
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }
}
